services:
  db:
    image: postgres:16-alpine
    container_name: eduself_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eduself_db}
      POSTGRES_USER: ${POSTGRES_USER:-eduself_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eduself_secret_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eduself_user} -d ${POSTGRES_DB:-eduself_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eduself-net

  redis:
    image: redis:7.2-alpine
    container_name: eduself_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eduself-net

volumes:
  postgres_data:
  redis_data:

networks:
  eduself-net:
    driver: bridge
