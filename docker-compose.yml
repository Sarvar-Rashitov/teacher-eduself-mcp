version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: eduself-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eduself_db}
      POSTGRES_USER: ${POSTGRES_USER:-eduself_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eduself_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eduself_user} -d ${POSTGRES_DB:-eduself_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: eduself-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: eduself-backend
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.local
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-eduself_db}
      - POSTGRES_USER=${POSTGRES_USER:-eduself_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-eduself_password}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
