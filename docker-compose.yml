version: '3.9'

# ============================================================
# EduSelf Teacher — docker-compose.yml
# Mahalliy ishlab chiqish muhiti
# Architecture.md §6.1, TECH_STACK.md §3.2 asosida
# ============================================================

services:

  # ============================================================
  # Django + Daphne ASGI — asosiy web server
  # ============================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: daphne -b 0.0.0.0 -p 8000 core.asgi:application
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.local
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  # ============================================================
  # Celery Worker — fon vazifalari
  # TECH_STACK.md §6: Google Sheets, AI Tasks, PDF Export
  # ============================================================
  celery:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: celery -A core worker --loglevel=info -Q default,high_priority,sync_sheets,ai_tasks
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.local
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  # ============================================================
  # Celery Beat — rejali vazifalar (har oy partitsiya yaratish)
  # ============================================================
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: celery -A core beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.local
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  # ============================================================
  # PostgreSQL 16 — asosiy ma'lumotlar bazasi
  # TECH_STACK.md §5.1: JSONB, Range Partitioning
  # ============================================================
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eduself}
      POSTGRES_USER: ${POSTGRES_USER:-eduself}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eduself} -d ${POSTGRES_DB:-eduself}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================
  # Redis 7.2 — Channel Layer, Kesh, Celery Broker
  # TECH_STACK.md §5.2: Kanal qatlami + AOF
  # ============================================================
  redis:
    image: redis:7.2-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# ============================================================
# Doimiy hajmlar (Volumes)
# ============================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
