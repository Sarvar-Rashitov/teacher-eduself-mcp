# deploy/nginx/conf.d/eduself.conf
# DEPLOYMENT_ARCHITECTURE.md §5 asosida

upstream backend_daphne {
    server web:8000;
    keepalive 32;
}

# 1. HTTP -> HTTPS Redirect
server {
    listen 80;
    server_name eduself.uz www.eduself.uz api.eduself.uz mcp.eduself.uz localhost;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Main Application Server
server {
    listen 443 ssl http2;
    server_name eduself.uz www.eduself.uz api.eduself.uz localhost;

    ssl_certificate /etc/letsencrypt/live/eduself.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eduself.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Statik Fayllar (To'g'ridan-to'g'ri Nginx kesh orqali)
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Media Fayllar
    location /media/ {
        alias /var/www/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # WebSocket Real-Time Marshruti (MUHIM: 3600s dars sessiyasi timeouti)
    location /ws/ {
        proxy_pass http://backend_daphne;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Public MCP Serveri (Server-Sent Events streaming)
    location /mcp/ {
        proxy_pass http://backend_daphne;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding off;
    }

    # Sog'lomlik tekshiruvlari (Monitoring Probes)
    location /health/ {
        proxy_pass http://backend_daphne;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # Standart REST API va HTML sahifalar
    location / {
        proxy_pass http://backend_daphne;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
