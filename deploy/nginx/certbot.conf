# ==============================================================================
# Let's Encrypt / Certbot Configuration for EduSelf Teacher
# Used with docker compose certbot container or host certbot client.
# ==============================================================================

# Asosiy domenlar ro'yxati
domains = api.eduself.uz, teacher.eduself.uz

# Admin elektron pochtasi (muddati tugashidan oldin ogohlantirish uchun)
email = admin@eduself.uz

# 4096-bit RSA yoki ECDSA kalit turi
key-type = ecdsa
elliptic-curve = secp384r1

# ACME Webroot yo'li (Nginx bilan umumiy volume orqali ulanadi)
authenticator = webroot
webroot-path = /var/www/certbot

# Xizmat shartlariga avtomatik rozilik
agree-tos = true
no-eff-email = true

# ==============================================================================
