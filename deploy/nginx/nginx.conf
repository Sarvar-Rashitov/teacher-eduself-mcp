# ==============================================================================
# EduSelf Teacher — Production Nginx Configuration
# Complies with DOC-SEC-01 (SECURITY.md) and DEPLOYMENT_ARCHITECTURE.md
# Features: HTTP/2, WebSocket Upgrade (/ws/), SSE Proxy (/mcp/), SSL Hardening
# ==============================================================================

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Log Formati (Mijozning haqiqiy IP manzili bilan)
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Fayl yuklash hajmi (Media fayllar va PDF import uchun)
    client_max_body_size 50M;

    # Gzip Siqish Sozlamalari
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Upstream Backend (Daphne ASGI Server)
    upstream daphne_backend {
        server backend:8000;
        keepalive 32;
    }

    # --------------------------------------------------------------------------
    # 1. HTTP -> HTTPS Redirect & Certbot ACME Challenge
    # --------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name api.eduself.uz teacher.eduself.uz localhost;

        # Let's Encrypt sertifikat yangilash yo'li
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        # Barcha qolgan HTTP so'rovlarni HTTPS ga yo'naltirish
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --------------------------------------------------------------------------
    # 2. Asosiy HTTPS Serveri
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name api.eduself.uz teacher.eduself.uz localhost;

        # SSL Sertifikatlari
        ssl_certificate /etc/letsencrypt/live/api.eduself.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.eduself.uz/privkey.pem;

        # SSL Xavfsizlik Qoidalari (TLS 1.2 va 1.3)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # Statik fayllarni to'g'ridan-to'g'ri Nginx orqali tarqatish
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            access_log off;
        }

        # Media fayllar
        location /media/ {
            alias /app/media/;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }

        # Sog'lomlik tekshiruvi (Health Check)
        location /health/ {
            proxy_pass http://daphne_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
        }

        # Real-time WebSockets (/ws/) marshruti
        location /ws/ {
            proxy_pass http://daphne_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Jonli dars sessiyalari uchun 1 soatlik uzluksiz taymout
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # MCP Server (Server-Sent Events) marshruti
        location /mcp/ {
            proxy_pass http://daphne_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE uchun kesh va buferlashni o'chirish
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
            chunked_transfer_encoding off;
        }

        # Asosiy REST API va Web Ilova marshruti
        location / {
            proxy_pass http://daphne_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 60s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }
}
