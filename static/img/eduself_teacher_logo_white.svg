<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 56" width="260" height="56" fill="none">
  <defs>
    <!-- 3D Claymorphic Gradients -->
    <linearGradient id="badgeGradWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A3D"/>
      <stop offset="50%" stop-color="#FF6B18"/>
      <stop offset="100%" stop-color="#E04D00"/>
    </linearGradient>
    <linearGradient id="goldGradWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE27A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="teacherPillWhite" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF7527"/>
      <stop offset="100%" stop-color="#FF4500"/>
    </linearGradient>
    
    <!-- Soft Claymorphic Filter Shadow -->
    <filter id="badgeShadowWhite" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#FF6B18" flood-opacity="0.38"/>
    </filter>
    <filter id="glowLightWhite" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- ================= 1. EMBLEM BADGE (Left) ================= -->
  <g transform="translate(4, 4)">
    <!-- Squircle Claymorphic Container with Shadow -->
    <rect x="0" y="0" width="48" height="48" rx="14" fill="url(#badgeGradWhite)" filter="url(#badgeShadowWhite)"/>
    
    <!-- Top inner light reflection for 3D clay look -->
    <path d="M4 14C4 8.47715 8.47715 4 14 4H34C39.5228 4 44 8.47715 44 14C44 16 38 12 24 12C10 12 4 16 4 14Z" fill="white" opacity="0.35"/>

    <!-- Subtle Uzbek Octagonal Star Contour (Mustaqillik Geometriyasi) -->
    <path d="M24 7L27.5 12.5H33.5L31.5 18L35 24L31.5 30L33.5 35.5H27.5L24 41L20.5 35.5H14.5L16.5 30L13 24L16.5 18L14.5 12.5H20.5L24 7Z" stroke="white" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.25" fill="none"/>

    <!-- Open Book Pages (Knowledge & Education) -->
    <!-- Left Page -->
    <path d="M24 33.5C21 32 16 31.5 13 32.5V20C16 19 21 19.5 24 21V33.5Z" fill="#FFF2EB" opacity="0.95"/>
    <path d="M24 32C21 30.5 16.5 30 14 31V21C16.5 20 21 20.5 24 22V32Z" fill="white"/>
    <!-- Right Page -->
    <path d="M24 33.5C27 32 32 31.5 35 32.5V20C32 19 27 19.5 24 21V33.5Z" fill="#FFF2EB" opacity="0.95"/>
    <path d="M24 32C27 30.5 31.5 30 34 31V21C31.5 20 27 20.5 24 22V32Z" fill="white"/>
    <!-- Book Spine -->
    <line x1="24" y1="20" x2="24" y2="34" stroke="#FF7527" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Graduation Cap / Mortarboard Floating Above (Academic Wisdom) -->
    <g transform="translate(16, 11)">
      <!-- Diamond cap top -->
      <polygon points="8,0 16,3.5 8,7 0,3.5" fill="url(#goldGradWhite)" filter="url(#glowLightWhite)"/>
      <polygon points="8,1 14.5,3.5 8,6 1.5,3.5" fill="#FFFBEB" opacity="0.4"/>
      <!-- Cap skull base -->
      <path d="M3.5 4.5V7C3.5 9 8 10.5 8 10.5C8 10.5 12.5 9 12.5 7V4.5" fill="url(#goldGradWhite)" opacity="0.85"/>
      <!-- Tassel hanging on left -->
      <path d="M8 3.5L3 5.5V8.5" stroke="#FFE27A" stroke-width="1" stroke-linecap="round"/>
      <circle cx="3" cy="9" r="0.8" fill="#FFE27A"/>
    </g>

    <!-- Sparkle Accent on top right -->
    <path d="M38 12L39 14.5L41.5 15.5L39 16.5L38 19L37 16.5L34.5 15.5L37 14.5L38 12Z" fill="#FFE27A" opacity="0.9"/>
  </g>

  <!-- ================= 2. TYPOGRAPHY & BADGE (Right) ================= -->
  <g transform="translate(62, 10)">
    <!-- Brand Title: EduSelf with white Edu and orange Self -->
    <text x="0" y="24" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="23" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Edu<tspan fill="#FF7527">Self</tspan></text>

    <!-- Glowing Dot on "i" accent -->
    <circle cx="61.5" cy="11.5" r="2.2" fill="#FF7527"/>
    <circle cx="61.5" cy="11.5" r="4" fill="#FF7527" opacity="0.3" filter="url(#glowLightWhite)"/>

    <!-- "TEACHER" Pill Badge -->
    <rect x="92" y="8" width="68" height="18" rx="9" fill="url(#teacherPillWhite)"/>
    <text x="126" y="20.5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.2">TEACHER</text>

    <!-- Subtitle: AI & Real-Time Classroom in light zinc / readable text -->
    <text x="0" y="38" font-family="'Poppins', system-ui, sans-serif" font-size="11" font-weight="600" fill="#A1A1AA" letter-spacing="0.2">
      AI &amp; Jonli Sinf Platformasi
    </text>
  </g>
</svg>
