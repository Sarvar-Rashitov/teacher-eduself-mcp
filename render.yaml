services:
  - type: web
    name: teacher-eduself-mcp
    runtime: python
    branch: muhriddin
    region: oregon
    plan: starter
    buildCommand: ./build.sh
    startCommand: daphne -b 0.0.0.0 -p $PORT core.asgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: USE_SQLITE
        value: "true"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: SECURE_SSL_REDIRECT
        value: "false"
