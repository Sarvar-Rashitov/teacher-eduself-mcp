[pytest]
DJANGO_SETTINGS_MODULE = core.settings.local
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
pythonpath = .

# pytest-asyncio: WebSocket va async testlar uchun (Backend.md §10)
asyncio_mode = auto

# Qo'shimcha parametrlar
addopts =
    -v
    --tb=short
    --strict-markers

# Test markalari
markers =
    asyncio: asinxron testlar
    websocket: WebSocket consumer testlari
    integration: integratsion testlar
    unit: birlik testlar
